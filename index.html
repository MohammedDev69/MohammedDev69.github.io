<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Nasr — Interactive Portfolio</title>
<meta name="description" content="A playable pixel-art developer room. Meet Mohamed Nasr, explore projects, tech stack and contact details.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0c11'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%23ffb454'/%3E%3Crect x='9' y='2' width='5' height='5' fill='%23e9e5dd'/%3E%3Crect x='2' y='9' width='5' height='5' fill='%23e9e5dd'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23ffb454'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-glow bg-glow--a"></div>
  <div class="bg-glow bg-glow--b"></div>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
</div>

<main class="site">
  <header class="topbar">
    <div class="brand">
      <canvas class="brand-avatar" id="brand-avatar" width="64" height="64" aria-hidden="true"></canvas>
      <div class="brand-text">
        <span class="brand-name">MOHAMED NASR</span>
        <span class="brand-sub">FULL-STACK DEVELOPER <i>/</i> ALEXANDRIA, EG</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn--ghost btn--icon" id="btn-github" type="button" aria-label="Open GitHub profile">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.2c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
        <span>GITHUB</span>
      </button>
      <button class="btn btn--amber" id="btn-resume" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M4 1h5l3 3v11H4V1Zm5 0v4h4M6 8h4v1H6V8Zm0 2h4v1H6v-1Zm0 2h3v1H6v-1Z"/></svg>
        <span>SKIP TO CLASSIC RESUME</span>
      </button>
    </div>
  </header>

  <section class="stage">
    <div class="cabinet" id="cabinet">
      <div class="chrome">
        <span class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="chrome-title">ROOM.EXE <b>—</b> MOHAMED&nbsp;NASR</span>
        <span class="chrome-status"><i class="live-dot"></i> ONLINE <b>·</b> <span id="clock">--:--</span> EET</span>
      </div>
      <div class="screen" id="screen">
        <canvas id="game" width="384" height="224" aria-label="Pixel art developer room. Use WASD or arrow keys to walk and E to interact."></canvas>
        <div class="screen-fx" aria-hidden="true"></div>

        <div class="hud hud--left">
          <div class="audio-toggles" role="group" aria-label="Audio settings">
            <button class="chip" id="btn-music" type="button" aria-pressed="false" title="Toggle 8-bit music">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M6 2h6v9.2a2.2 2.2 0 1 1-2-2.19V4.4L8 5v7.2A2.2 2.2 0 1 1 6 10V2Z"/></svg>
              <span>MUSIC</span><b data-state>OFF</b>
            </button>
            <button class="chip" id="btn-sfx" type="button" aria-pressed="true" title="Toggle sound effects">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M2 6h3l4-3v10L5 10H2V6Zm9-2a5 5 0 0 1 0 8v-1a4 4 0 0 0 0-6V4Z"/></svg>
              <span>SFX</span><b data-state>ON</b>
            </button>
          </div>

          <div class="dpad" id="dpad" aria-label="Touch movement controls">
            <button class="dpad-btn dpad-up" data-dir="up" type="button" aria-label="Move up">▲</button>
            <button class="dpad-btn dpad-left" data-dir="left" type="button" aria-label="Move left">◀</button>
            <button class="dpad-btn dpad-action" data-action="interact" type="button" aria-label="Interact">A</button>
            <button class="dpad-btn dpad-right" data-dir="right" type="button" aria-label="Move right">▶</button>
            <button class="dpad-btn dpad-down" data-dir="down" type="button" aria-label="Move down">▼</button>
          </div>
        </div>

        <div class="hud hud--right">
          <button class="chip chip--square" id="btn-help" type="button" aria-label="How to play" title="How to play">?</button>
        </div>

        <div class="hintbar" id="hintbar">
          <span class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><em>/</em><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE</span>
          <span class="hint-sep"></span>
          <span class="hint"><kbd>E</kbd><em>/</em><kbd>ENTER</kbd> TALK &amp; INSPECT</span>
        </div>
      </div>
      <div class="cabinet-foot">
        <span>© <span id="year">2026</span> MOHAMED NASR</span>
        <span class="cabinet-foot-mid">BUILT WITH CANVAS + VANILLA JS · NO FRAMEWORKS, NO BROKEN IMAGES</span>
        <span>v1.0.0</span>
      </div>
    </div>
  </section>
</main>

<!-- ======================= RPG DIALOGUE ======================= -->
<div class="dialogue" id="dialogue" role="dialog" aria-modal="true" aria-labelledby="dlg-name" hidden>
  <div class="dlg-frame">
    <div class="dlg-portrait">
      <canvas id="dlg-portrait" width="96" height="96" aria-hidden="true"></canvas>
      <span class="dlg-lv">LV. 99</span>
    </div>
    <div class="dlg-main">
      <div class="dlg-head">
        <h2 id="dlg-name">MOHAMED NASR</h2>
        <span class="dlg-role" id="dlg-role">FULL-STACK DEVELOPER</span>
        <span class="dlg-advance" id="dlg-advance" aria-hidden="true">▼</span>
      </div>
      <div class="dlg-text" id="dlg-text" tabindex="0"></div>
      <div class="dlg-choices" id="dlg-choices"></div>
    </div>
    <button class="dlg-close" id="dlg-close" type="button" aria-label="Close dialogue">✕</button>
  </div>
</div>

<!-- ======================= MODAL ======================= -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-bar">
      <span class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <h2 class="modal-title" id="modal-title">WINDOW</h2>
      <button class="modal-x" type="button" data-close aria-label="Close window">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js?v=9"></script>
<script src="js/pixel-font.js?v=9"></script>
<script src="js/sprites.js?v=9"></script>
<script src="js/room.js?v=9"></script>
<script src="js/audio.js?v=9"></script>
<script src="js/ui.js?v=9"></script>
<script src="js/game.js?v=9"></script>
</body>
</html>
